spring:
  application:
    name: ddk-example-inventory
  datasource:
    url: jdbc:h2:mem:inventory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

ddk:
  event:
    inbox:
      enabled: true
  projection:
    sweep-interval: 5s
  cache:
    key-prefix: "inventory:cache:"
    caches:
      skus:
        local-enabled: true
  concurrency:
    key-prefix: "inventory:"

# 可售数量低于它的商品进入「库存偏低」读模型
inventory:
  low-stock-threshold: 5
