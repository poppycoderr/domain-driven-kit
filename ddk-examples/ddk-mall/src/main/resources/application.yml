spring:
  application:
    name: ddk-mall
  # 默认使用内存 H2，不依赖任何外部组件即可启动
  datasource:
    url: jdbc:h2:mem:mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

# 上下文之间的消息怎么传：local 在进程内转发，不需要消息中间件；compose profile 改成 rocketmq
mall:
  messaging:
    transport: local

ddk:
  mybatis:
    db-type: h2
  event:
    inbox:
      enabled: true
  # 默认 profile 不连 Redis：库存锁退回进程内实现，只适合单实例。compose profile 里打开
  concurrency:
    enabled: false
