spring:
  application:
    name: ddk-mall
  # 默认使用内存 H2，不依赖任何外部组件即可启动
  datasource:
    url: jdbc:h2:mem:mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  # 默认 profile 没有 Redis：不创建连接，缓存只剩进程内的一级，库存锁和任务锁都放在进程内。compose profile 里恢复
  autoconfigure:
    exclude: org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  ai:
    mcp:
      server:
        name: ddk-mall

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

ddk:
  mybatis:
    db-type: h2
  event:
    inbox:
      enabled: true
    # 默认 profile 没有消息中间件：上下文之间的消息由 DDK 在进程内转发。compose profile 里关掉，改走 RocketMQ
    local-delivery:
      enabled: true
  cache:
    key-prefix: "mall:cache:"
    caches:
      # 商品很少变：两级缓存，各实例的一级缓存最多滞后 5 分钟
      product:
        ttl: 1h
        local-enabled: true
        local-ttl: 5m
      # 库存变化频繁：有 Redis 时只用共享的二级缓存，写操作提交后失效，过期时间兜底
      stock:
        ttl: 1m
  # 默认 profile 没有 Redis：定时任务的锁放在进程内存里，只适合单实例。compose profile 里换回 Redis
  job:
    lock:
      store: local
  # 默认 profile 不连 Redis：库存锁退回进程内实现，只适合单实例。compose profile 里打开
  concurrency:
    enabled: false

mall:
  order:
    # 下单后多久没有支付就关闭订单；关单任务多久扫描一次
    payment-timeout: 30m
    close-interval: 30s
  payment:
    simulated:
      # 模拟渠道的单笔上限，超过的支付会被拒绝
      decline-above: 50000

# 默认不向外上报：链路照常生成（响应头里有 X-Trace-Id，日志里有 traceId），只是不导出。observability profile 里打开导出
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  otlp:
    metrics:
      export:
        enabled: false
