spring:
  application:
    name: ddk-mall
  # 默认使用内存 H2，不依赖任何外部组件即可启动
  datasource:
    url: jdbc:h2:mem:mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

ddk:
  mybatis:
    db-type: h2
  event:
    inbox:
      enabled: true
    # 默认 profile 没有消息中间件：上下文之间的消息由 DDK 在进程内转发。compose profile 里关掉，改走 RocketMQ
    local-delivery:
      enabled: true
  # 默认 profile 不连 Redis：库存锁退回进程内实现，只适合单实例。compose profile 里打开
  concurrency:
    enabled: false

mall:
  order:
    # 下单后多久没有支付就关闭订单；关单任务多久扫描一次
    payment-timeout: 30m
    close-interval: 30s
  payment:
    simulated:
      # 模拟渠道的单笔上限，超过的支付会被拒绝
      decline-above: 50000
