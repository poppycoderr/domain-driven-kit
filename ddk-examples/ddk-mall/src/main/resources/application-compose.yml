# 连接 docker-compose.yml 里的 MySQL、Redis 与 RocketMQ
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: mall
    password: example_password
  data:
    redis:
      host: localhost
      port: 6379

ddk:
  mybatis:
    db-type: mysql
  event:
    local-delivery:
      enabled: false
    rocketmq:
      name-server: localhost:9876
      producer-group: mall-producer
  concurrency:
    enabled: true
    key-prefix: "mall:"
