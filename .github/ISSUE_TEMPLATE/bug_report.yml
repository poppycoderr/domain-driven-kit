name: Bug report
description: Something in DDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through the Security tab instead, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: DDK version
      description: The `ddk-dependencies` or archetype version, for example 0.11.0.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      description: For example `ddk-event-starter` or `ddk-core`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Java version, Spring Boot version, and the database, Redis or broker involved.
      placeholder: Java 21.0.5, Spring Boot 4.1.1, MySQL 8.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full exception or log lines.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Link the README or documentation section that describes the expected behavior, if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest configuration and code that shows it. A project generated from the archetype is a good starting point.
    validations:
      required: true
