name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  # 来源证明：id-token 换取 Sigstore 签名证书，attestations 把证明写进仓库
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 仓库里始终是 SNAPSHOT 版本，发布时按 tag 改写版本号；ddk-dependencies 不继承父 pom，它的 ddk.version 属性单独改
      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false
          sed -i "s|<ddk.version>.*</ddk.version>|<ddk.version>$VERSION</ddk.version>|" ddk-dependencies/pom.xml

      - name: Build and test
        run: mvn -B -ntp install -Parchetype-it,release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -path ./ddk-examples -prune -o -path '*/target/*.jar' -print \
            | grep -v -e '-tests\.jar$' -e '/test-classes/' \
            | xargs -I{} cp {} dist/
          cp ddk-dependencies/pom.xml "dist/ddk-dependencies-$VERSION.pom"
          ls -l dist

      # 给每个发布的 jar 和 BOM 生成 SLSA 来源证明，证明它们由这个仓库的这次 tag 构建产生。
      # 使用者用 gh attestation verify <文件> --repo poppycoderr/domain-driven-kit 校验
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      # 发布说明取自 CHANGELOG.md 中对应版本的一节
      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      # 带连字符的版本（例如 1.0.0-RC1）是候选版：标成 pre-release，不会成为 Latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          case "$VERSION" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${PRERELEASE[@]}"
