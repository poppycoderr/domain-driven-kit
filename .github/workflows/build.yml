name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 不能加 -DskipTests：它只跳过测试执行、不跳过测试编译，历史上正是靠它掩盖了
      # ddk-cache-starter 测试类的语法错误，导致整个 reactor 长期构建失败。
      # 用 install 而不是 verify：archetype 集成测试会生成项目并对它执行 mvn verify，
      # 生成的项目要从本地仓库解析 DDK 各模块。
      - name: Build and test
        run: mvn -B -ntp install -Parchetype-it

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore
