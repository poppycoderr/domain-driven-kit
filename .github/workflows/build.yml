name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 是最低支持版本，25 是当前 LTS
        java: [ '21', '25' ]
    name: test (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # 不能加 -DskipTests：它只跳过测试执行、不跳过测试编译，历史上正是靠它掩盖了
      # ddk-cache-starter 测试类的语法错误，导致整个 reactor 长期构建失败。
      # 用 install 而不是 verify：archetype 集成测试会生成项目并对它执行 mvn verify，
      # 生成的项目要从本地仓库解析 DDK 各模块。
      # 安装脚本的版本选择：不联网、不构建 DDK，几秒钟
      - name: Test the installer
        run: scripts/test-ddk.sh

      # 公开 API 兼容性检查要和上一个发布版本比较。DDK 没有发布到 Maven Central，基线 jar 从 GitHub Release 下载后装进本地仓库
      - name: Install the API baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-api-baseline.sh

      # api-check：与上一个发布版本相比出现不兼容的公开 API 变化时构建失败，有意的变化要在根 pom 的放行列表里写明
      - name: Build and test
        run: mvn -B -ntp install -Parchetype-it,release,api-check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

  # 分支保护要求名为 build 的检查；矩阵任务的名字带 Java 版本，由这个汇总任务统一给出结果
  build:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every Java version to pass
        run: test "${{ needs.test.result }}" = "success"
