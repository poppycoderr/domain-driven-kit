name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 是最低支持版本，25 是当前 LTS
        java: [ '21', '25' ]
    name: test (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # 几秒钟的检查放在前面：BOM 不继承父 pom，版本写了两份；安装脚本的版本选择不联网、不构建 DDK
      - name: Check the BOM against the parent pom
        run: python3 scripts/check-bom.py

      - name: Test the installer
        run: scripts/test-ddk.sh

      # 不能加 -DskipTests：它只跳过测试执行、不跳过测试编译，历史上正是靠它掩盖了
      # ddk-cache-starter 测试类的语法错误，导致整个 reactor 长期构建失败。
      # 用 install 而不是 verify：后面的 archetype 集成测试要从本地仓库解析 DDK 各模块。
      # 容器测试在没有 Docker 时会自己跳过；CI 关掉这个条件，Docker 不可用就直接失败
      - name: Unit, wiring and middleware tests
        run: mvn -B -ntp install -Prelease '-Djunit.jupiter.conditions.deactivate=org.testcontainers.*'

      # 用两种 archetype 生成项目，再对生成的项目执行 mvn verify
      - name: Generated projects
        run: mvn -B -ntp install -Parchetype-it -pl ddk-archetypes/ddk-layer3-archetype,ddk-archetypes/ddk-layer4-archetype

      # 包括生成项目的测试报告；任何被跳过的测试都让构建失败
      - name: Require that no test was skipped
        run: python3 scripts/check-test-reports.py

      # 公开 API 兼容性检查要和上一个发布版本比较。0.10.0 之前的版本只在 GitHub Release 上，基线 jar 统一从 Release 下载后装进本地仓库
      - name: Install the API baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-api-baseline.sh

      # 比较上面已经打好的 jar，不重新测试。不兼容的公开 API 变化让构建失败，有意的变化要在根 pom 的放行列表里写明。
      # 写全插件坐标：命令行上的前缀解析不到 profile 里的插件。BOM 没有 Java API，也不继承父 pom 里锁定的插件版本，排除在外
      - name: API compatibility
        run: mvn -B -ntp -Papi-check -pl '!ddk-dependencies' com.github.siom79.japicmp:japicmp-maven-plugin:cmp

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
          if-no-files-found: ignore

  # GraalVM 原生镜像：编译示例，再对可执行文件跑冒烟测试。ddk-example-user 覆盖 web、mybatis、event、mcp，
  # ddk-example-inventory 覆盖并发、Redis、两级缓存、投影和发布登记；声明为原生已验证的模块以它们为准
  native:
    runs-on: ubuntu-latest
    name: native image (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: ddk-example-user
            smoke: scripts/native-smoke.sh
          # 依赖 Redis 的 starter：并发、两级缓存、投影、Spring Modulith 的发布登记
          - example: ddk-example-inventory
            smoke: scripts/native-smoke-inventory.sh
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25.0.2'
          distribution: 'graalvm-community'
          cache: maven

      # 测试已经在 test 任务里跑过，这里只构建示例用到的模块
      - name: Install the modules the example needs
        run: mvn -B -ntp install -DskipTests -pl ddk-examples/${{ matrix.example }} -am

      - name: Build the native image
        run: mvn -B -ntp -Pnative -DskipTests -pl ddk-examples/${{ matrix.example }} native:compile

      - name: Smoke test the native image
        run: ${{ matrix.smoke }} ddk-examples/${{ matrix.example }}/target/${{ matrix.example }}

  # 分支保护要求名为 build 的检查；矩阵任务的名字带 Java 版本，由这个汇总任务统一给出结果
  build:
    runs-on: ubuntu-latest
    needs: [ test, native ]
    if: always()
    steps:
      - name: Require every Java version and the native image to pass
        run: test "${{ needs.test.result }}" = "success" && test "${{ needs.native.result }}" = "success"
