  <rect width="900" height="392" rx="12" fill="#0B1020"/>
  <rect width="900" height="40" rx="12" fill="#151B30"/>
  <rect y="28" width="900" height="12" fill="#151B30"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F57"/><circle cx="44" cy="20" r="6" fill="#FEBC2E"/><circle cx="64" cy="20" r="6" fill="#28C840"/>
  <text x="450.0" y="25" text-anchor="middle" fill="#8791AD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">order-service</text>
    <text class="l l1" x="28" y="78" xml:space="preserve"><tspan fill="#7EE787">$ </tspan><tspan fill="#D6DCF0">ddk.sh new order-service</tspan></text>
  <text class="l l2" x="28" y="99" xml:space="preserve"><tspan fill="#A78BFA">==&gt; </tspan><tspan fill="#D6DCF0">Cloning DDK</tspan></text>
  <text class="l l3" x="28" y="120" xml:space="preserve"><tspan fill="#A78BFA">==&gt; </tspan><tspan fill="#D6DCF0">Installing DDK 0.5.0-SNAPSHOT into the local Maven repository</tspan></text>
  <text class="l l4" x="28" y="141" xml:space="preserve"><tspan fill="#A78BFA">==&gt; </tspan><tspan fill="#D6DCF0">Generating order-service (4 layers, package com.example.orderservice) with DDK 0.5.0-SNAPSHOT</tspan></text>
  <text class="l l5" x="28" y="162" xml:space="preserve"><tspan fill="#A78BFA">==&gt; </tspan><tspan fill="#D6DCF0">Done. Next steps:</tspan></text>
  <text class="l l6" x="28" y="183" xml:space="preserve"><tspan fill="#8791AD">    cd order-service</tspan></text>
  <text class="l l7" x="28" y="204" xml:space="preserve"><tspan fill="#8791AD">    mvn verify</tspan></text>
  <text class="l l8" x="28" y="78" xml:space="preserve"><tspan fill="#8791AD"># someone takes a shortcut: the domain model reaches into the persistence layer</tspan></text>
  <text class="l l9" x="28" y="99" xml:space="preserve"><tspan fill="#A78BFA">  src/main/java/com/example/orderservice/domain/model/Order.java</tspan></text>
  <text class="l l10" x="28" y="120" xml:space="preserve"><tspan fill="#7EE787">+ import com.example.orderservice.infrastructure.orm.po.OrderPO;</tspan></text>
  <text class="l l11" x="28" y="141" xml:space="preserve"><tspan fill="#D6DCF0">  public class Order {</tspan></text>
  <text class="l l12" x="28" y="162" xml:space="preserve"><tspan fill="#7EE787">+     private OrderPO po;</tspan></text>
  <text class="l l13" x="28" y="183" xml:space="preserve"><tspan fill="#D6DCF0">  }</tspan></text>
  <text class="l l14" x="28" y="78" xml:space="preserve"><tspan fill="#7EE787">$ </tspan><tspan fill="#D6DCF0">mvn verify</tspan></text>
  <text class="l l15" x="28" y="99" xml:space="preserve"><tspan fill="#FF7B72">[ERROR] </tspan><tspan fill="#D6DCF0">ArchitectureTest.architectureIsRespected:22 Architecture violated: 2 violation(s).</tspan></text>
  <text class="l l16" x="28" y="120" xml:space="preserve"><tspan fill="#D6DCF0">        Fix the code; do not delete or relax the rules.</tspan></text>
  <text class="l l17" x="28" y="141" xml:space="preserve"><tspan fill="#8791AD">Report: target/archguard/violations.md</tspan></text>
  <text class="l l18" x="28" y="162" xml:space="preserve"><tspan fill="#D6DCF0"></tspan></text>
  <text class="l l19" x="28" y="183" xml:space="preserve"><tspan fill="#E3B341">[DOMAIN_MUST_NOT_DEPEND_ON_OUTER_LAYERS] </tspan><tspan fill="#D6DCF0">com.example.orderservice.domain.model.Order</tspan></text>
  <text class="l l20" x="28" y="204" xml:space="preserve"><tspan fill="#D6DCF0">  Field &lt;…domain.model.Order.po&gt; has type &lt;…infrastructure.orm.po.OrderPO&gt; in (Order.java:0)</tspan></text>
  <text class="l l21" x="28" y="225" xml:space="preserve"><tspan fill="#7EE787">  How to fix: </tspan><tspan fill="#D6DCF0">The domain layer must not reference types from outer layers: define a port in</tspan></text>
  <text class="l l22" x="28" y="246" xml:space="preserve"><tspan fill="#D6DCF0">  domain.acl for the capability and implement it in infrastructure, and pass the data in as</tspan></text>
  <text class="l l23" x="28" y="267" xml:space="preserve"><tspan fill="#D6DCF0">  parameters or value objects.</tspan></text>
  <text class="l l24" x="28" y="288" xml:space="preserve"><tspan fill="#D6DCF0"></tspan></text>
  <text class="l l25" x="28" y="309" xml:space="preserve"><tspan fill="#FF7B72">[ERROR] </tspan><tspan fill="#D6DCF0">Tests run: 2, Failures: 1, Errors: 0, Skipped: 0</tspan></text>
  <text class="l l26" x="28" y="330" xml:space="preserve"><tspan fill="#8791AD">[INFO] </tspan><tspan fill="#FF7B72">BUILD FAILURE</tspan></text>
  <text class="l l27" x="28" y="78" xml:space="preserve"><tspan fill="#8791AD"># follow the hint: the domain model no longer knows the persistence object</tspan></text>
  <text class="l l28" x="28" y="99" xml:space="preserve"><tspan fill="#A78BFA">  src/main/java/com/example/orderservice/domain/model/Order.java</tspan></text>
  <text class="l l29" x="28" y="120" xml:space="preserve"><tspan fill="#FF7B72">- import com.example.orderservice.infrastructure.orm.po.OrderPO;</tspan></text>
  <text class="l l30" x="28" y="141" xml:space="preserve"><tspan fill="#D6DCF0">  public class Order {</tspan></text>
  <text class="l l31" x="28" y="162" xml:space="preserve"><tspan fill="#FF7B72">-     private OrderPO po;</tspan></text>
  <text class="l l32" x="28" y="183" xml:space="preserve"><tspan fill="#D6DCF0">  }</tspan></text>
  <text class="l l33" x="28" y="78" xml:space="preserve"><tspan fill="#7EE787">$ </tspan><tspan fill="#D6DCF0">mvn verify</tspan></text>
  <text class="l l34" x="28" y="99" xml:space="preserve"><tspan fill="#8791AD">[INFO] </tspan><tspan fill="#D6DCF0">Tests run: 2, Failures: 0, Errors: 0, Skipped: 0</tspan></text>
  <text class="l l35" x="28" y="120" xml:space="preserve"><tspan fill="#8791AD">[INFO] </tspan><tspan fill="#7EE787">BUILD SUCCESS</tspan></text>
</svg>
