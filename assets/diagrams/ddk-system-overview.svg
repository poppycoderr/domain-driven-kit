<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DDK system overview</title>
  <desc id="desc">Domain Driven Kit connects application code, core abstractions, MyBatis support, Spring Boot starters, architecture guard rules, project archetypes and documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="blue" x1="130" y1="90" x2="1050" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .subtitle{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
      .label{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
      .tiny{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#94A3B8}
      .card{fill:#111827;stroke:#334155;stroke-width:1.5;filter:url(#shadow)}
      .core{fill:#172554;stroke:#38BDF8;stroke-width:2;filter:url(#shadow)}
      .line{stroke:#64748B;stroke-width:2.2;stroke-linecap:round}
      .accent{stroke:#38BDF8;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="160" fill="#2563EB" opacity="0.16"/>
  <circle cx="140" cy="545" r="190" fill="#14B8A6" opacity="0.12"/>

  <text x="70" y="72" class="title">Domain Driven Kit</text>
  <text x="70" y="105" class="subtitle">Practical Java DDD scaffolding, backend contracts and executable architecture rules.</text>

  <rect x="430" y="225" width="340" height="170" rx="26" class="core"/>
  <text x="600" y="285" text-anchor="middle" class="label">DDK Core</text>
  <text x="600" y="316" text-anchor="middle" class="small">Response · Exception · Page</text>
  <text x="600" y="343" text-anchor="middle" class="small">Mapper · Repository Contract</text>

  <rect x="70" y="180" width="270" height="115" rx="20" class="card"/>
  <text x="205" y="226" text-anchor="middle" class="label">Application Code</text>
  <text x="205" y="255" text-anchor="middle" class="small">Adapter · Application · Domain</text>

  <rect x="70" y="365" width="270" height="115" rx="20" class="card"/>
  <text x="205" y="411" text-anchor="middle" class="label">Architecture Guard</text>
  <text x="205" y="440" text-anchor="middle" class="small">ArchUnit rules in CI</text>

  <rect x="860" y="180" width="270" height="115" rx="20" class="card"/>
  <text x="995" y="226" text-anchor="middle" class="label">Spring Boot Starters</text>
  <text x="995" y="255" text-anchor="middle" class="small">Web · DB · Redis · Cache</text>

  <rect x="860" y="365" width="270" height="115" rx="20" class="card"/>
  <text x="995" y="411" text-anchor="middle" class="label">MyBatis Support</text>
  <text x="995" y="440" text-anchor="middle" class="small">Repository · Query · Page</text>

  <rect x="430" y="475" width="340" height="84" rx="20" class="card"/>
  <text x="600" y="511" text-anchor="middle" class="label">Archetypes &amp; Examples</text>
  <text x="600" y="538" text-anchor="middle" class="small">3-layer · 4-layer · runnable samples</text>

  <path d="M340 238 C378 238 390 274 430 285" class="line"/>
  <path d="M340 422 C382 414 395 362 430 342" class="line"/>
  <path d="M770 285 C812 275 818 238 860 238" class="line"/>
  <path d="M770 342 C812 354 820 422 860 422" class="line"/>
  <path d="M600 395 L600 475" class="accent"/>

  <rect x="420" y="132" width="360" height="48" rx="24" fill="url(#blue)" opacity="0.92"/>
  <text x="600" y="163" text-anchor="middle" class="small" fill="#FFFFFF">Visible · Reusable · Testable DDD conventions</text>

  <text x="70" y="560" class="tiny">Current emphasis: stable core contracts, starter normalization, domain primitives, runnable examples.</text>
</svg>
