<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 838" width="1120" height="838"
     role="img" aria-labelledby="ttl dsc" style="max-width:100%;height:auto">
  <title id="ttl">DDK module dependency map</title>
  <desc id="dsc">Applications depend on starters, starters depend on ddk-core; only ddk-mybatis-starter and applications that persist data go through ddk-mybatis; ddk-core contains the domain, repository, page, mapper, response and exception packages.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk-b" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk-v" d="M0 0 L10 5 L0 10 z"/>
    </marker>
</defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,Roboto,sans-serif;}
    .bg{fill:#FBFCFE}
    .title{font-size:27px;font-weight:700;fill:#0F172A;letter-spacing:-.2px}
    .sub{font-size:14px;font-weight:400;fill:#64748B}
    .kicker{font-size:11.5px;font-weight:700;fill:#94A3B8;letter-spacing:1.4px}
    .lbl{font-size:15px;font-weight:650;fill:#0F172A}
    .lbl-sm{font-size:13.5px;font-weight:650;fill:#0F172A}
    .txt{font-size:12.5px;font-weight:400;fill:#64748B}
    .txt-xs{font-size:11.5px;font-weight:400;fill:#94A3B8}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;font-weight:500;fill:#334155}
    .mono-sm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:500;fill:#64748B}
    .edgelbl{font-size:11.5px;font-weight:500;fill:#64748B}

    .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.25}
    .group{fill:#F1F5F9;fill-opacity:.55;stroke:#E2E8F0;stroke-width:1.25}
    .blue{fill:#EFF6FF;stroke:#BFDBFE;stroke-width:1.25}
    .teal{fill:#F0FDFA;stroke:#99F6E4;stroke-width:1.25}
    .violet{fill:#F5F3FF;stroke:#DDD6FE;stroke-width:1.25}
    .amber{fill:#FFFBEB;stroke:#FDE68A;stroke-width:1.25}
    .rose{fill:#FFF1F2;stroke:#FECDD3;stroke-width:1.25}
    .slate{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1.25}

    .t-blue{fill:#1D4ED8} .t-teal{fill:#0F766E} .t-violet{fill:#6D28D9}
    .t-amber{fill:#B45309} .t-rose{fill:#BE123C} .t-ink{fill:#0F172A}

    .edge{stroke:#94A3B8;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    .edge-b{stroke:#3B82F6;stroke-width:1.8;fill:none;marker-end:url(#ar-b)}
    .edge-v{stroke:#8B5CF6;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#ar-v)}
    .edge-x{stroke:#F43F5E;stroke-width:1.6;fill:none;stroke-dasharray:5 5}
    .rail{stroke:#E2E8F0;stroke-width:2;fill:none}
    .hair{stroke:#E2E8F0;stroke-width:1.25;fill:none}
    .mk{fill:#94A3B8} .mk-b{fill:#3B82F6} .mk-v{fill:#8B5CF6}

    @media (prefers-color-scheme: dark) {
      .bg{fill:#0B1120}
      .title{fill:#F1F5F9} .sub{fill:#94A3B8} .kicker{fill:#64748B}
      .lbl,.lbl-sm{fill:#E2E8F0} .txt{fill:#94A3B8} .txt-xs{fill:#64748B}
      .mono{fill:#CBD5E1} .mono-sm{fill:#94A3B8} .edgelbl{fill:#94A3B8}
      .card{fill:#111827;stroke:#283548}
      .group{fill:#0F172A;fill-opacity:.7;stroke:#1E293B}
      .blue{fill:#111E38;stroke:#1E40AF}
      .teal{fill:#0C2620;stroke:#115E59}
      .violet{fill:#1A1333;stroke:#5B21B6}
      .amber{fill:#271B08;stroke:#92400E}
      .rose{fill:#2A0F17;stroke:#9F1239}
      .slate{fill:#131C2B;stroke:#283548}
      .t-blue{fill:#93C5FD} .t-teal{fill:#5EEAD4} .t-violet{fill:#C4B5FD}
      .t-amber{fill:#FCD34D} .t-rose{fill:#FDA4AF} .t-ink{fill:#E2E8F0}
      .edge{stroke:#64748B} .edge-b{stroke:#60A5FA} .edge-v{stroke:#A78BFA}
      .edge-x{stroke:#FB7185}
      .rail{stroke:#1E293B} .hair{stroke:#1E293B}
      .mk{fill:#64748B} .mk-b{fill:#60A5FA} .mk-v{fill:#A78BFA}
    }
</style>
  <rect class="bg" width="1120" height="838" rx="18"/>
  <text class="title" x="56" y="60">Module dependency map</text>
  <text class="sub" x="56" y="87">Arrows point along dependencies. Only persistence touches ddk-mybatis; every other starter depends on ddk-core directly.</text>
  <rect x="56" y="130" width="1008" height="64" rx="12" class="blue"/>
  <text class="lbl" x="80" y="168">Your application</text>
  <text class="txt-xs" x="1040" y="168" text-anchor="end">Pick the starters you need; the BOM manages versions</text>
  <path class="edge" d="M560 196 L560 222"/>
  <text class="edgelbl" x="572" y="214">depends on</text>
  <rect x="56" y="224" width="1008" height="294" rx="14" class="group"/>
  <text class="lbl-sm" x="80" y="254">ddk-starters</text>
  <text class="txt-xs" x="208" y="254">9 Spring Boot starters under one ddk.* namespace</text>
  <rect x="76" y="272" width="312" height="62" rx="10" class="card"/>
  <circle cx="94" cy="296" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="106" y="300">ddk-web-starter</text>
  <text class="txt-xs" x="106" y="320">Exceptions · Jackson · CORS</text>
  <rect x="404" y="272" width="312" height="62" rx="10" class="card"/>
  <circle cx="422" cy="296" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="434" y="300">ddk-mybatis-starter</text>
  <text class="txt-xs" x="434" y="320">Paging · locking · snowflake IDs</text>
  <rect x="732" y="272" width="312" height="62" rx="10" class="card"/>
  <circle cx="750" cy="296" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="762" y="300">ddk-event-starter</text>
  <text class="txt-xs" x="762" y="320">Domain events after commit</text>
  <rect x="76" y="350" width="312" height="62" rx="10" class="card"/>
  <circle cx="94" cy="374" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="106" y="378">ddk-redis-starter</text>
  <text class="txt-xs" x="106" y="398">Allow-listed typed JSON</text>
  <rect x="404" y="350" width="312" height="62" rx="10" class="card"/>
  <circle cx="422" cy="374" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="434" y="378">ddk-cache-starter</text>
  <text class="txt-xs" x="434" y="398">Caffeine + Redis two levels</text>
  <rect x="732" y="350" width="312" height="62" rx="10" class="card"/>
  <circle cx="750" cy="374" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="762" y="378">ddk-db-starter</text>
  <text class="txt-xs" x="762" y="398">Named data sources</text>
  <rect x="76" y="428" width="312" height="62" rx="10" class="card"/>
  <circle cx="94" cy="452" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="106" y="456">ddk-tracer-starter</text>
  <text class="txt-xs" x="106" y="476">OpenTelemetry · trace ID header</text>
  <rect x="404" y="428" width="312" height="62" rx="10" class="card"/>
  <circle cx="422" cy="452" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="434" y="456">ddk-seata-starter</text>
  <text class="txt-xs" x="434" y="476">Outbound XID propagation</text>
  <rect x="732" y="428" width="312" height="62" rx="10" class="card"/>
  <circle cx="750" cy="452" r="3.5" fill="#14B8A6"/>
  <text class="lbl-sm" x="762" y="456">ddk-archguard-starter</text>
  <text class="txt-xs" x="762" y="476">ArchUnit layer rules</text>
  <rect x="56" y="572" width="440" height="76" rx="12" class="teal"/>
  <text class="lbl" x="80" y="604">ddk-mybatis</text>
  <text class="txt" x="80" y="628">Generic repository · query parsing · paging</text>
  <path class="edge" d="M200 522 L200 564"/>
  <text class="edgelbl" x="212" y="554">ddk-mybatis-starter and persisting apps</text>
  <rect x="56" y="688" width="1008" height="96" rx="12" class="violet"/>
  <text class="lbl" x="80" y="722">ddk-core</text>
  <text class="txt-xs" x="80" y="746">No persistence framework</text>
  <rect x="292" y="722" width="68" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="326.0" y="742" text-anchor="middle">domain</text>
  <rect x="372" y="722" width="100" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="422.0" y="742" text-anchor="middle">repository</text>
  <rect x="484" y="722" width="52" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="510.0" y="742" text-anchor="middle">page</text>
  <rect x="548" y="722" width="68" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="582.0" y="742" text-anchor="middle">mapper</text>
  <rect x="628" y="722" width="84" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="670.0" y="742" text-anchor="middle">response</text>
  <rect x="724" y="722" width="92" height="30" rx="8" class="card"/>
  <text class="mono-sm" x="770.0" y="742" text-anchor="middle">exception</text>
  <text class="txt-xs" x="292" y="772">com.ddk.core.domain may not depend on any framework, enforced by tests</text>
  <path class="edge" d="M200 652 L200 680"/>
  <path class="edge" d="M900 522 L900 680"/>
  <text class="edgelbl" x="888" y="598" text-anchor="end">Other starters only need ddk-core</text>
  <text class="edgelbl" x="888" y="618" text-anchor="end">and never pull in MyBatis</text>
  <text class="txt-xs" x="56" y="812">ddk-dependencies (BOM): import once, drop module versions   ·   ddk-archetypes: three- and four-layer project skeletons</text>

</svg>
