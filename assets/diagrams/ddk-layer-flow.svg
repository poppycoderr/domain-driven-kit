<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DDK four-layer request flow</title>
  <desc id="desc">A request flows through adapter, application, domain and infrastructure while dependencies point inward toward domain contracts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:800 36px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .sub{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
      .layer{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}
      .desc{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#D1D5DB}
      .mono{font:700 14px SFMono-Regular,Consolas,monospace;fill:#BFDBFE}
      .box{stroke-width:2}
      .arrow{stroke:#93C5FD;stroke-width:3;marker-end:url(#arrow)}
      .back{stroke:#FBBF24;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrowGold)}
      .guard{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#FDE68A}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93C5FD"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <text x="64" y="70" class="title">Four-Layer Flow</text>
  <text x="64" y="103" class="sub">Runtime calls move outward. Compile-time dependencies still point inward.</text>

  <rect x="90" y="180" width="230" height="150" rx="24" fill="#1E3A8A" stroke="#60A5FA" class="box"/>
  <text x="205" y="230" text-anchor="middle" class="layer">Adapter</text>
  <text x="205" y="265" text-anchor="middle" class="desc">HTTP / MQ / CLI</text>
  <text x="205" y="292" text-anchor="middle" class="mono">Controller · Consumer</text>

  <rect x="360" y="180" width="230" height="150" rx="24" fill="#064E3B" stroke="#34D399" class="box"/>
  <text x="475" y="230" text-anchor="middle" class="layer">Application</text>
  <text x="475" y="265" text-anchor="middle" class="desc">Use-case orchestration</text>
  <text x="475" y="292" text-anchor="middle" class="mono">Service · Command · DTO</text>

  <rect x="630" y="180" width="230" height="150" rx="24" fill="#581C87" stroke="#C084FC" class="box"/>
  <text x="745" y="230" text-anchor="middle" class="layer">Domain</text>
  <text x="745" y="265" text-anchor="middle" class="desc">Rules and invariants</text>
  <text x="745" y="292" text-anchor="middle" class="mono">Entity · VO · Repository</text>

  <rect x="900" y="180" width="230" height="150" rx="24" fill="#7C2D12" stroke="#FB923C" class="box"/>
  <text x="1015" y="230" text-anchor="middle" class="layer">Infrastructure</text>
  <text x="1015" y="265" text-anchor="middle" class="desc">Technical adapters</text>
  <text x="1015" y="292" text-anchor="middle" class="mono">Mapper · PO · Client</text>

  <path d="M320 255 L360 255" class="arrow"/>
  <path d="M590 255 L630 255" class="arrow"/>
  <path d="M860 255 L900 255" class="back"/>
  <text x="880" y="238" text-anchor="middle" class="guard">implements</text>

  <path d="M1015 330 C1015 440 745 440 745 330" class="back"/>
  <text x="880" y="430" text-anchor="middle" class="guard">implements domain contracts</text>

  <rect x="145" y="430" width="910" height="148" rx="26" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="478" text-anchor="middle" class="layer">ArchGuard makes this testable</text>
  <text x="600" y="514" text-anchor="middle" class="desc">Domain cannot import Spring, MyBatis or Jackson.</text>
  <text x="600" y="542" text-anchor="middle" class="desc">Domain cannot depend on Infrastructure.</text>
  <text x="600" y="568" text-anchor="middle" class="mono">CommonArchRules.LAYERED_ARCHITECTURE_RULE</text>
</svg>
